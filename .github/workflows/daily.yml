name: Ultimate Bot — Daily

on:
  schedule:
    # Daily 09:00 Bangkok = 02:00 UTC
    - cron: "0 2 * * *"
    # Daily 15:00 Bangkok = 08:00 UTC (test phase: probe voice across time-of-day)
    - cron: "0 8 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit seen.json back

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHAP_GROUP_ID: ${{ secrets.LINE_CHAP_GROUP_ID }}
        run: python run.py

      - name: Commit seen.json
        run: |
          git config user.name "ultimate-bot"
          git config user.email "bot@bni-ultimate.local"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "chore: update seen articles [skip ci]"
          git push || true
