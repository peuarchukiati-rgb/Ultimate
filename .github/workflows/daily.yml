name: Ultimate Bot — Daily

on:
  # Schedule lives in cron-job.org (GH Actions free-tier schedule dropped
  # ~8/9 hourly runs in testing). Update timing there, not here.
  workflow_dispatch:

permissions:
  contents: write  # needed to commit seen.json + stats.jsonl back

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHAP_GROUP_ID: ${{ secrets.LINE_CHAP_GROUP_ID }}
        run: python run.py

      - name: Commit state files
        run: |
          git config user.name "ultimate-bot"
          git config user.email "bot@bni-ultimate.local"
          git add seen.json stats.jsonl || true
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git push || true
