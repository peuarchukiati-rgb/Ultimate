name: Ultimate Bot — Daily

on:
  schedule:
    # TEMPORARY: every hour at :07 to verify cron actually fires reliably.
    # 2x/day cadence (09:07 + 15:07 BKK) makes confirming cron behavior take
    # 2-3 days. Hourly = confirm in 1-2 hours. Revert to "7 2,8 * * *" after
    # 24h once cron reliability is verified.
    - cron: "7 * * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit seen.json back

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHAP_GROUP_ID: ${{ secrets.LINE_CHAP_GROUP_ID }}
        run: python run.py

      - name: Commit seen.json
        run: |
          git config user.name "ultimate-bot"
          git config user.email "bot@bni-ultimate.local"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "chore: update seen articles [skip ci]"
          git push || true
