name: Debug Token

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect both secrets
        env:
          LINE_T: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os
          for name in ('LINE_T', 'GEMINI_K'):
              t = os.environ.get(name, '')
              print(f'=== {name} ===')
              print(f'  len: {len(t)}')
              print(f'  has_LF: {chr(10) in t}')
              print(f'  has_CR: {chr(13) in t}')
              print(f'  is_ascii: {t.isascii()}')
              ws = [(i, ord(c)) for i, c in enumerate(t) if c.isspace() or not c.isascii()]
              if ws:
                  print(f'  whitespace/non-ascii positions: {ws[:10]}')
              else:
                  print(f'  no whitespace or non-ascii')
          "
